# Ambiente independente: nenhum volume ou segredo do banco de desenvolvimento.
name: conale-tests
services:
  # Banco exclusivo para os testes, sem expor uma porta na maquina.
  mysql-test:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: conale_test
      MYSQL_USER: conale_test
      MYSQL_PASSWORD: test_only
      MYSQL_ROOT_PASSWORD: root_test_only
    # Dados temporarios: nao sao preservados quando o container para.
    tmpfs:
      - /var/lib/mysql
    # Libera os testes somente quando o MySQL responder a uma consulta.
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=test_only mysql --protocol=TCP -h127.0.0.1 -uconale_test conale_test -e 'SELECT 1' --silent > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s
  # Usa a etapa do Dockerfile que executa os testes do Maven.
  backend-test:
    build:
      context: ./backend
      target: test
    environment:
      DB_URL: "jdbc:mysql://mysql-test:3306/conale_test?allowPublicKeyRetrieval=true&sslMode=DISABLED"
      DB_USERNAME: conale_test
      DB_PASSWORD: test_only
    depends_on:
      mysql-test:
        condition: service_healthy
