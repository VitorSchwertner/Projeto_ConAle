name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend - lint e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend - testes com MySQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f compose.test.yaml up --build --abort-on-container-exit --exit-code-from backend-test
      - name: Exibir logs em caso de falha
        if: failure()
        run: docker compose -f compose.test.yaml logs --no-color
      - name: Remover ambiente temporário
        if: always()
        run: docker compose -f compose.test.yaml down
